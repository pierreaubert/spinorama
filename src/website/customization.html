<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <title>Customization — Spinorama</title>
    <%include file="head.html"/>
  </head>
  <body>
    <%include file="symbols.html"/>
    <nav class="navbar-bar mx-1 my-1">
      <div class="dropdown is-hoverable" id="menu-main">
        <div class="dropdown-trigger" id="menu-main-trigger">
          <button type="button" class="button" aria-haspopup="true" aria-controls="menu-main" aria-label="menu-main">
            <svg class="icon"><use href="#icon-bars"/></svg>
          </button>
        </div>
        <div class="dropdown-menu" id="menu-main-dropdown" role="menu">
          <div class="dropdown-content">
            <%include file="nav_menu.html"/>
          </div>
        </div>
      </div>
      <a href="/" class="navbar-brand-link is-size-4">
        <b>SPIN</b>orama
      </a>
    </nav>

    <div class="container">
      <div class="section">
        <h2 class="title is-4">Customization</h2>

        <div class="customization-grid">
          <!-- Theme -->
          <div class="custom-card">
            <h3 class="title is-6 mb-2">Theme</h3>
            <div class="theme-toggle" role="radiogroup" aria-label="Theme">
              <button type="button" class="theme-toggle-btn" data-theme="light" aria-label="Light theme">
                <svg width="16" height="16"><use href="#icon-theme-light"/></svg>
              </button>
              <button type="button" class="theme-toggle-btn" data-theme="dark" aria-label="Dark theme">
                <svg width="16" height="16"><use href="#icon-theme-dark"/></svg>
              </button>
            </div>
          </div>

          <!-- Units -->
          <div class="custom-card">
            <h3 class="title is-6 mb-2">Units</h3>
            <div class="field has-addons mb-0">
              <p class="control"><button class="button is-small unit-btn is-active" data-units="metric">Metric</button></p>
              <p class="control"><button class="button is-small unit-btn" data-units="imperial">Imperial</button></p>
            </div>
          </div>
          <!-- Columns -->
          <div class="custom-card">
            <h3 class="title is-6 mb-2">Graphs per row</h3>
            <div class="field has-addons mb-0">
              <p class="control"><button class="button is-small col-btn is-active" data-cols="1">1</button></p>
              <p class="control"><button class="button is-small col-btn" data-cols="2">2</button></p>
              <p class="control"><button class="button is-small col-btn" data-cols="4">4</button></p>
            </div>
          </div>
        </div>

        <!-- Plot settings — populated by JS -->
        <h3 class="title is-5 mt-5 mb-3">Plot settings</h3>
        <div id="global-config-panel"></div>

      </div>
    </div>

    <script type="module">
      import { loadConfigFromStorage, initGlobalConfigPanel } from '/js/plot-config-${versions['CACHE']}${min}.js';
      const config = loadConfigFromStorage('Graph');
      initGlobalConfigPanel(config);
    </script>
  </body>
</html>
