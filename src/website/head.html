<meta http-equiv="content-type" content="text/html;charset=utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>
  // Prevent FOUC: apply stored theme before CSS loads
  (function() {
    var t = localStorage.getItem('spinorama-theme');
    if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
    else if (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.setAttribute('data-theme', 'dark');
  })();
</script>

<link rel="stylesheet" href="/css/bulma-${versions['BULMA']}.min.css">
<link media="all" href="/css/spinorama.css" rel="stylesheet" crossorigin="anonymous">
<link rel="icon" type="image/png" href="/pictures/favicon-16x16.png" sizes="16x16">

<script src="/js/theme-${versions['CACHE']}${min}.js"></script>
<script type="module" src="/js/onload-${versions['CACHE']}${min}.js"></script>
