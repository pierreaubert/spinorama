<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <title>A collection of loudspeakers measurements</title>
    <meta http-equiv="content-type" content="text/html;charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet" href="/css/bulma-1.0.4.min.css">
    <link media="all" href="/css/spinorama.css" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/png" href="/pictures/favicon-16x16.png" sizes="16x16">

    <body>

      <div class="grid">
	<div class="cell">
	  <div class="dropdown is-hoverable">
	    <div class="dropdown-trigger">
	      <button class="button" aria-haspopup="true" aria-controls="dropdown-plotconfig-theme">
		<span>Fonts</span>
		<span class="icon is-small">
		  <i class="fas fa-angle-down" aria-hidden="true">v</i>
		</span>
	      </button>
	    </div>
	    <div class="dropdown-menu" id="dropdown-plotconfig-theme" role="menu">
	      <div class="dropdown-content">
		<div class="grid">
		  <div class="cell">
		    <div class="config-section" style="margin-bottom: 20px; padding: 0px;">
		      <div class="section-header is-clickable" style="display: flex; align-items: center; padding: 10px; background-color: rgb(245, 245, 245); border-radius: 4px; cursor: pointer; border: 1px solid rgb(224, 224, 224);">
			<h4 style="margin: 0px; font-size: 1rem; font-weight: bold; flex-grow: 1;">Fonts</h4>
			<span style="margin-left: 10px; font-size: 0.8rem; transition: transform 0.2s;">▼</span>
		      </div>
		      <div class="section-content" style="display: block; padding: 10px; border-right: 1px solid rgb(224, 224, 224); border-bottom: 1px solid rgb(224, 224, 224); border-left: 1px solid rgb(224, 224, 224); border-image: initial; border-top: none; background: rgb(255, 255, 255); border-radius: 0px 0px 4px 4px;">
			<div class="config-flex-container" style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-start;" data-protonpass-form="">
			  <div class="form-group field" style="width: 100%; flex: 1 1 auto; min-width: 180px; max-width: 300px;"><label class="label is-small">Font Family</label><div class="control" style="display: flex; align-items: center;"><div class="select is-small is-fullwidth"></div><select name="config-font-family"><option value="Arial, sans-serif">Arial, sans-serif</option><option value="Helvetica, Arial, sans-serif">Helvetica, Arial, sans-serif</option><option value="Georgia, serif">Georgia, serif</option><option value="Times New Roman, serif">Times New Roman, serif</option><option value="Courier New, monospace">Courier New, monospace</option></select></div></div><div class="form-group field" style="width: 100%; flex: 1 1 auto; min-width: 180px; max-width: 300px;"><label class="label is-small">Font Size</label><div class="control" style="display: flex; align-items: center;"><input type="number" name="config-font-size" id="config-font-size" min="8" max="24" step="1" style="width: 100%; padding: 5px; border: 1px solid rgb(221, 221, 221); border-radius: 3px;"></div></div><div class="form-group field" style="width: 100%; flex: 1 1 auto; min-width: 180px; max-width: 300px;"><label class="label is-small">Font Color</label><div class="control" style="display: flex; align-items: center;"><div style="display: inline-block; width: 20px; height: 20px; background-color: rgb(51, 51, 51); border: 1px solid rgb(221, 221, 221); margin-left: 8px; vertical-align: middle;"></div><input type="color" class="input is-small" name="config-font-color" style="width: 40px; height: 30px; padding: 0px; cursor: pointer;"></div></div></div></div></div>		    cell 1
		  </div>
		  <div class="cell">
		    cell 2
		  </div>
		  <div class="cell">
		    cell 3
		  </div>
		</div>
	      </div>
	    </div>
	  </div>
	</div>
	<div class="cell">
	  <div class="dropdown is-hoverable">
	    <div class="dropdown-trigger">
	      <button class="button" aria-haspopup="true" aria-controls="dropdown-plotconfig-colormap">
		<span>Colormap</span>
		<span class="icon is-small">
		  <i class="fas fa-angle-down" aria-hidden="true">v</i>
		</span>
	      </button>
	    </div>
	    <div class="dropdown-menu" id="dropdown-plotconfig-colormap" role="menu">
	      <div class="dropdown-content">
		<div class="grid">
		  <div class="cell">
		    cell 1
		  </div>
		  <div class="cell">
		    cell 2
		  </div>
		  <div class="cell">
		    cell 3
		  </div>
		</div>
	      </div>
	    </div>
	  </div>
	</div>
      </div>

    </body>
</html>
