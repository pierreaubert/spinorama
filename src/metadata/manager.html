<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speaker Metadata Manager - Spinorama</title>
    <link rel="stylesheet" href="node_modules/bulma/css/bulma.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .step-indicator {
            margin-bottom: 2rem;
        }
        .step-item {
            flex: 1;
            text-align: center;
            padding: 1rem;
            border-bottom: 3px solid #dbdbdb;
            position: relative;
        }
        .step-item.is-active {
            border-bottom-color: #3273dc;
            color: #3273dc;
        }
        .step-item.is-completed {
            border-bottom-color: #48c774;
            color: #48c774;
        }
        .measurement-panel {
            margin-bottom: 1rem;
        }
        .hidden {
            display: none !important;
        }
        .export-code {
            background: #f5f5f5;
            border: 1px solid #dbdbdb;
            border-radius: 4px;
            padding: 1rem;
            font-family: monospace;
            white-space: pre-wrap;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
    <div id="app">
        <nav class="navbar is-primary" role="navigation">
            <div class="navbar-brand">
                <a class="navbar-item" href="https://spinorama.org">
                    <strong>Spinorama</strong>
                </a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <a class="navbar-item">
                        <i class="fas fa-cog"></i>
                        &nbsp;Metadata Manager
                    </a>
                </div>
            </div>
        </nav>

        <div class="container mt-5">
            <!-- Step Indicator -->
            <div class="step-indicator">
                <div class="columns is-mobile">
                    <div class="column step-item" id="step-1-indicator">
                        <i class="fas fa-search"></i>
                        <p class="mt-2">Select Speaker</p>
                    </div>
                    <div class="column step-item" id="step-2-indicator">
                        <i class="fas fa-edit"></i>
                        <p class="mt-2">Edit Parameters</p>
                    </div>
                    <div class="column step-item" id="step-3-indicator">
                        <i class="fas fa-check"></i>
                        <p class="mt-2">Validate & Export</p>
                    </div>
                </div>
            </div>

            <!-- Step 1: Speaker Selection -->
            <div id="step-1" class="step-content">
                <div class="card">
                    <header class="card-header">
                        <p class="card-header-title">
                            <i class="fas fa-search mr-2"></i>
                            Speaker Selection
                        </p>
                    </header>
                    <div class="card-content">
                        <div class="field">
                            <label class="label">Choose an option:</label>
                            <div class="control">
                                <label class="radio">
                                    <input type="radio" name="speaker-option" value="existing" checked>
                                    Select existing speaker
                                </label>
                                <label class="radio ml-4">
                                    <input type="radio" name="speaker-option" value="new">
                                    Create new speaker
                                </label>
                            </div>
                        </div>

                        <!-- Existing Speaker Selection -->
                        <div id="existing-speaker-section">
                            <div class="field">
                                <label class="label">Search Speakers</label>
                                <div class="control has-icons-left">
                                    <input class="input" type="text" id="speaker-search" placeholder="Type to search speakers...">
                                    <span class="icon is-small is-left">
                                        <i class="fas fa-search"></i>
                                    </span>
                                </div>
                            </div>
                            <div class="field">
                                <div class="control">
                                    <div class="select is-fullwidth">
                                        <select id="speaker-list" title="Select a speaker from the list">
                                            <option value="">Loading speakers...</option>
                                        </select>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- New Speaker Creation -->
                        <div id="new-speaker-section" class="hidden">
                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Brand</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select id="brand-list">
                                                    <option value="">Loading brands...</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                    <div class="field">
                                        <label class="label">Or enter new brand</label>
                                        <div class="control">
                                            <input class="input" type="text" id="new-brand" placeholder="Enter new brand name">
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Speaker Name</label>
                                        <div class="control">
                                            <input class="input" type="text" id="speaker-name" placeholder="Enter speaker model name">
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="field is-grouped is-grouped-right mt-5">
                            <div class="control">
                                <button class="button is-primary" id="next-to-step-2">
                                    Next <i class="fas fa-arrow-right ml-2"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Step 2: Parameter Editing -->
            <div id="step-2" class="step-content hidden">
                <div class="card">
                    <header class="card-header">
                        <p class="card-header-title">
                            <i class="fas fa-edit mr-2"></i>
                            Speaker Parameters
                        </p>
                    </header>
                    <div class="card-content">
                        <form id="speaker-form">
                            <!-- Basic Information -->
                            <div class="field">
                                <label class="label">Speaker Name</label>
                                <div class="control">
                                    <input class="input" type="text" id="form-speaker-name" readonly>
                                </div>
                            </div>

                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Brand</label>
                                        <div class="control">
                                            <input class="input" type="text" id="form-brand" readonly>
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Model</label>
                                        <div class="control">
                                            <input class="input" type="text" id="form-model" required>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Type</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select id="form-type" required>
                                                    <option value="">Select type</option>
                                                    <option value="passive">Passive</option>
                                                    <option value="active">Active</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Shape</label>
                                        <div class="control">
                                            <div class="select is-fullwidth">
                                                <select id="form-shape" required>
                                                    <option value="">Select shape</option>
                                                    <option value="floorstanders">Floorstanders</option>
                                                    <option value="bookshelves">Bookshelves</option>
                                                    <option value="center">Center</option>
                                                    <option value="surround">Surround</option>
                                                    <option value="omnidirectional">Omnidirectional</option>
                                                    <option value="columns">Columns</option>
                                                    <option value="cbt">CBT</option>
                                                    <option value="outdoor">Outdoor</option>
                                                    <option value="panel">Panel</option>
                                                    <option value="inwall">In-wall</option>
                                                    <option value="soundbar">Soundbar</option>
                                                    <option value="liveportable">Live Portable</option>
                                                    <option value="toursound">Tour Sound</option>
                                                    <option value="cinema">Cinema</option>
                                                </select>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div class="columns">
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Price</label>
                                        <div class="control">
                                            <input class="input" type="text" id="form-price" placeholder="e.g., $500">
                                        </div>
                                    </div>
                                </div>
                                <div class="column">
                                    <div class="field">
                                        <label class="label">Amount</label>
                                        <div class="control">
                                            <input class="input" type="text" id="form-amount" placeholder="e.g., each, pair">
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Measurements Section -->
                            <div class="field mt-5">
                                <label class="label">Measurements</label>
                                <div class="control">
                                    <button type="button" class="button is-success" id="add-measurement">
                                        <i class="fas fa-plus mr-2"></i>Add Measurement
                                    </button>
                                </div>
                            </div>

                            <div id="measurements-container">
                                <!-- Measurements will be added here dynamically -->
                            </div>

                            <div class="field is-grouped mt-5">
                                <div class="control">
                                    <button type="button" class="button" id="back-to-step-1">
                                        <i class="fas fa-arrow-left mr-2"></i>Back
                                    </button>
                                </div>
                                <div class="control ml-auto">
                                    <button type="button" class="button is-primary" id="next-to-step-3">
                                        Next <i class="fas fa-arrow-right ml-2"></i>
                                    </button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Step 3: Validation & Export -->
            <div id="step-3" class="step-content hidden">
                <div class="card">
                    <header class="card-header">
                        <p class="card-header-title">
                            <i class="fas fa-check mr-2"></i>
                            Validation & Export
                        </p>
                    </header>
                    <div class="card-content">
                        <div id="validation-status" class="notification is-info">
                            <i class="fas fa-spinner fa-spin mr-2"></i>
                            Validating parameters...
                        </div>

                        <div id="validation-results" class="hidden">
                            <div class="field">
                                <label class="label">Validation Results</label>
                                <div id="validation-messages"></div>
                            </div>

                            <div class="field mt-5">
                                <label class="label">Generated Python Code</label>
                                <div class="control">
                                    <div id="export-code" class="export-code"></div>
                                </div>
                            </div>

                            <div class="field is-grouped mt-5">
                                <div class="control">
                                    <button type="button" class="button is-success" id="download-code">
                                        <i class="fas fa-download mr-2"></i>Download Code
                                    </button>
                                </div>
                                <div class="control">
                                    <button type="button" class="button is-info" id="copy-code">
                                        <i class="fas fa-copy mr-2"></i>Copy to Clipboard
                                    </button>
                                </div>
                            </div>
                        </div>

                        <div class="field is-grouped mt-5">
                            <div class="control">
                                <button type="button" class="button" id="back-to-step-2">
                                    <i class="fas fa-arrow-left mr-2"></i>Back
                                </button>
                            </div>
                            <div class="control ml-auto">
                                <button type="button" class="button is-primary" id="start-over">
                                    <i class="fas fa-redo mr-2"></i>Start Over
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="./manager.js"></script>
</body>
</html>
